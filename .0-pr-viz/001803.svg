<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1803 · Warn on unknown agent type, fix stale plan pointer</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Unknown agent strings silently became the default type, and the plan cited code that moved;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now one helper warns on the fallback, and the pointer names the deny-plus-ratchet regime.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <g>
    <rect x="80" y="250" width="860" height="132" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="292" font-size="26" fill="#7aa2f7">agent_type.parse().unwrap_or_default() ×5</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">a typo'd or future agent string renders as default</text>
    <text x="104" y="364" font-size="22" fill="#565f89">continuations.rs — AgentOutput on five broadcast paths</text>
  </g>
  <g>
    <rect x="80" y="402" width="860" height="132" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="444" font-size="26" fill="#7aa2f7">REFACTOR_PLAN cites moved survey sites</text>
    <text x="104" y="482" font-size="23" fill="#a9b1d6">heartbeat unwrap gone; proxy_tokens unwraps tests-only</text>
    <text x="104" y="516" font-size="22" fill="#565f89">background.rs:151 is a doc comment — the hunt misfires</text>
  </g>
  <line x1="510" y1="534" x2="510" y2="940" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">data problems invisible, docs misdirect</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">silent default hides the rot the plan can't locate</text>
  </g>

  <g>
    <rect x="1065" y="250" width="860" height="132" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="292" font-size="26" fill="#9ece6a">parse_agent_type(raw) warns, then defaults</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">warn!("Unknown session agent_type {raw:?}…") on Err</text>
    <text x="1089" y="364" font-size="22" fill="#565f89">same fallback value — rendering never breaks</text>
  </g>
  <g>
    <rect x="1065" y="402" width="860" height="132" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="444" font-size="26" fill="#9ece6a">plan describes the current regime</text>
    <text x="1089" y="482" font-size="23" fill="#a9b1d6">workspace deny + per-file #1165 ratchets, tests exempt</text>
    <text x="1089" y="516" font-size="22" fill="#565f89">next hunter lands on live policy, not archaeology</text>
  </g>
  <line x1="1495" y1="534" x2="1495" y2="940" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">behavior identical, unknowns logged</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">316 backend lib tests pass; clippy clean</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Fallback kept by design — rendering must never break on a new agent string.</text>
</svg>
