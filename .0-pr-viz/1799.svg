<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1799 · Remove panics from admin, tasks, chart paths</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Three render paths could panic — a NaN timestamp, a missing router, an empty stack floor;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now total order, error cards, and guarded floors, so the panels degrade instead of dying.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <g>
    <rect x="80" y="250" width="860" height="132" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="292" font-size="26" fill="#7aa2f7">partial_cmp(..).unwrap() on f64 started_at</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">one NaN timestamp panics the whole tasks panel sort</text>
    <text x="104" y="364" font-size="22" fill="#565f89">tasks_panel.rs — every render sorts the active set</text>
  </g>
  <g>
    <rect x="80" y="402" width="860" height="132" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="444" font-size="26" fill="#7aa2f7">use_navigator().unwrap() in admin_page</text>
    <text x="104" y="482" font-size="23" fill="#a9b1d6">no router context → panic instead of the error card</text>
    <text x="104" y="516" font-size="22" fill="#565f89">admin/mod.rs — 401 redirect needs the navigator</text>
  </g>
  <g>
    <rect x="80" y="554" width="860" height="132" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="596" font-size="26" fill="#7aa2f7">bottoms.last().unwrap() in stacked_area</text>
    <text x="104" y="634" font-size="23" fill="#a9b1d6">safe today (seeded vec) but one refactor from panic</text>
    <text x="104" y="668" font-size="22" fill="#565f89">charts/stacked_area.rs — Performance page plot</text>
  </g>
  <line x1="510" y1="686" x2="510" y2="940" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">edge-case data kills healthy panels</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">a single NaN poisons every task row on screen</text>
  </g>

  <g>
    <rect x="1065" y="250" width="860" height="132" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="292" font-size="26" fill="#9ece6a">started_at.total_cmp(&amp;other.started_at)</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">panic-free total order across finite, inf, and NaN</text>
    <text x="1089" y="364" font-size="22" fill="#565f89">valid timestamps sort exactly as before</text>
  </g>
  <g>
    <rect x="1065" y="402" width="860" height="132" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="444" font-size="26" fill="#9ece6a">Option navigator + error-card fallback</text>
    <text x="1089" y="482" font-size="23" fill="#a9b1d6">401 without router shows “reload and sign in again”</text>
    <text x="1089" y="516" font-size="22" fill="#565f89">redirect path unchanged where a router exists</text>
  </g>
  <g>
    <rect x="1065" y="554" width="860" height="132" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="596" font-size="26" fill="#9ece6a">if-let break on the seeded floor vec</text>
    <text x="1089" y="634" font-size="23" fill="#a9b1d6">invariant documented; last chart ratchet removed</text>
    <text x="1089" y="668" font-size="22" fill="#565f89">identical polygons on all current data</text>
  </g>
  <line x1="1495" y1="686" x2="1495" y2="940" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">panels degrade, never die</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">677 frontend tests pass; clippy clean</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Stacked on #1796 for utils::send_json (patch_user); review this diff against that base only.</text>
</svg>
