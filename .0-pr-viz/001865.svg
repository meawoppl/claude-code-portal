<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1865 · Share worktree branch format between backend and launcher</text>

  <!-- Thesis -->
  <text x="55" y="100" font-size="34" fill="#e6e9f5">The unnamed-worktree name lived as two literals that had to match by convention;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now one shared shape mints both, so rail name and branch can never drift.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <!-- Panel labels + center divider -->
  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- ==================== BEFORE panel: x 55–945 ==================== -->

  <g>
    <rect x="80" y="250" width="810" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="290" font-size="26" fill="#7aa2f7">launchers.rs — default_worktree_branch()</text>
    <text x="104" y="326" font-size="23" fill="#f7768e">"session-{}" + "%Y%m%d-%H%M%S", inline</text>
    <text x="104" y="362" font-size="23" fill="#a9b1d6">mints the rail display name before launch</text>
    <text x="104" y="398" font-size="22" fill="#565f89">must equal the branch the launcher will make</text>
  </g>

  <g>
    <rect x="80" y="460" width="810" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="500" font-size="26" fill="#7aa2f7">worktree.rs — default_branch_name()</text>
    <text x="104" y="536" font-size="23" fill="#f7768e">"session-{}" + "%Y%m%d-%H%M%S", inline again</text>
    <text x="104" y="572" font-size="23" fill="#a9b1d6">fallback branch when no name is supplied</text>
    <text x="104" y="608" font-size="22" fill="#565f89">kept in sync with the backend by a comment</text>
  </g>

  <line x1="485" y1="650" x2="485" y2="690" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <g>
    <rect x="80" y="710" width="810" height="180" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="756" font-size="26" fill="#c0caf5">edit one, forget the other</text>
    <text x="104" y="792" font-size="23" fill="#f7768e">a format tweak lands once and drifts —</text>
    <text x="104" y="828" font-size="23" fill="#f7768e">the rail shows a name that matches no branch</text>
  </g>

  <!-- ==================== AFTER panel: x 1040–1945 ==================== -->

  <g>
    <rect x="1065" y="250" width="810" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="290" font-size="26" fill="#7aa2f7">shared/lib.rs — one canonical shape</text>
    <text x="1089" y="326" font-size="23" fill="#9ece6a">WORKTREE_BRANCH_PREFIX = "session-"</text>
    <text x="1089" y="362" font-size="23" fill="#9ece6a">WORKTREE_BRANCH_TIME_FORMAT = "%Y%m%d-%H%M%S"</text>
    <text x="1089" y="398" font-size="22" fill="#565f89">WASM-safe consts, no new dependency</text>
  </g>

  <g>
    <rect x="1065" y="460" width="810" height="190" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="500" font-size="26" fill="#c0caf5">both defaults build from the consts</text>
    <text x="1089" y="536" font-size="23" fill="#a9b1d6">launchers.rs + worktree.rs format the same pair</text>
    <text x="1089" y="572" font-size="23" fill="#a9b1d6">same strings, same call sites as before</text>
    <text x="1089" y="608" font-size="22" fill="#565f89">mirroring comments replaced by shared truth</text>
  </g>

  <line x1="1470" y1="650" x2="1470" y2="690" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="710" width="810" height="180" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="756" font-size="26" fill="#c0caf5">one shape, zero drift</text>
    <text x="1089" y="792" font-size="23" fill="#9ece6a">one edit updates backend display + launcher branch</text>
    <text x="1089" y="828" font-size="23" fill="#a9b1d6">both sides' tests pass, clippy + WASM build clean</text>
  </g>

  <!-- Footer -->
  <text x="55" y="1172" font-size="22" fill="#565f89">Unnamed launches only: caller-supplied names still sanitize launcher-side in sanitize_branch_name.</text>
</svg>
