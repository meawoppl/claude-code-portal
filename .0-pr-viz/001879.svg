<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1879 · SVGs always paint their own #1a1b26 backdrop, never transparency</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">The reminder taught agents transparent SVG backgrounds — right in the transcript, invisible</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">on GitHub's white; every SVG now paints its own #1a1b26 rect, identical here, legible there.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- ==================== BEFORE: same diagram on two backdrops ==================== -->
  <text x="80" y="258" font-size="22" fill="#a9b1d6">one transparent SVG, two hosts</text>
  <g>
    <rect x="80" y="275" width="400" height="220" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="100" y="310" font-size="20" fill="#565f89">portal transcript (#1a1b26)</text>
    <rect x="120" y="330" width="200" height="60" fill="none" stroke="#7aa2f7" stroke-width="1.5"/>
    <text x="140" y="366" font-size="20" fill="#c0caf5">readable box</text>
    <line x1="150" y1="410" x2="290" y2="410" stroke="#565f89" stroke-width="1.5"/>
    <text x="140" y="450" font-size="19" fill="#a9b1d6">axes and grid read fine</text>
  </g>
  <g>
    <rect x="520" y="275" width="400" height="220" fill="#e6e9f5" stroke="#3d4666" stroke-width="1.5"/>
    <text x="540" y="310" font-size="20" fill="#565f89">GitHub light theme (white)</text>
    <rect x="560" y="330" width="200" height="60" fill="none" stroke="#c0caf5" stroke-width="1"/>
    <text x="580" y="366" font-size="20" fill="#c0caf5">ghost text</text>
    <line x1="590" y1="410" x2="730" y2="410" stroke="#c0caf5" stroke-width="1"/>
    <text x="580" y="450" font-size="19" fill="#c0caf5">near-invisible on white</text>
  </g>

  <line x1="500" y1="530" x2="500" y2="596" stroke="#f7768e" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#arr-red)"/>

  <g>
    <rect x="80" y="600" width="840" height="160" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="642" font-size="26" fill="#7aa2f7">portal_reminder.md said: transparent, no white rect</text>
    <text x="104" y="680" font-size="23" fill="#a9b1d6">correct only where the portal supplies the backdrop behind the image</text>
    <text x="104" y="714" font-size="21" fill="#565f89">agents applied it uniformly — the reminder never split the two cases</text>
  </g>

  <g>
    <rect x="80" y="930" width="840" height="150" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="976" font-size="26" fill="#c0caf5">checked-in diagrams legible in exactly one place</text>
    <text x="104" y="1014" font-size="23" fill="#f7768e">docs/portal_link_rendering.svg shipped with no backdrop at all</text>
    <text x="104" y="1048" font-size="21" fill="#565f89">docs sites, editors, PDFs, bare browser tabs — all composite onto white</text>
  </g>

  <!-- ==================== AFTER ==================== -->
  <g>
    <rect x="1065" y="250" width="860" height="200" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="292" font-size="26" fill="#9ece6a">one sentence, no conditional: always paint #1a1b26</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">an explicit opaque rect renders identically in the transcript</text>
    <text x="1089" y="364" font-size="23" fill="#a9b1d6">(same color as the backdrop) and survives every other host</text>
    <text x="1089" y="398" font-size="21" fill="#565f89">matplotlib: facecolor #1a1b26, not transparent=True — a few bytes per file</text>
  </g>

  <line x1="1495" y1="450" x2="1495" y2="516" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="520" width="860" height="240" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="562" font-size="26" fill="#c0caf5">three touch points</text>
    <text x="1089" y="600" font-size="23" fill="#a9b1d6">claude-session-lib/portal_reminder.md — the bundled guidance</text>
    <text x="1089" y="634" font-size="23" fill="#a9b1d6">AGENTS.md — mirrored conventions section (it said nothing before)</text>
    <text x="1089" y="668" font-size="23" fill="#a9b1d6">docs/portal_link_rendering.svg — backdrop painted retroactively</text>
    <text x="1089" y="702" font-size="21" fill="#565f89">operators overriding PORTAL_REMINDER_FILE update their own copy</text>
    <text x="1089" y="732" font-size="21" fill="#565f89">000-pr-visualization/ files already paint #16161e — never affected</text>
  </g>

  <line x1="1495" y1="760" x2="1495" y2="922" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="930" width="860" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="976" font-size="26" fill="#c0caf5">diagrams carry their own backdrop</text>
    <text x="1089" y="1014" font-size="23" fill="#9ece6a">legible on the portal, GitHub light or dark, docs, editors, and print</text>
    <text x="1089" y="1048" font-size="21" fill="#565f89">the failure mode is removed rather than documented around</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Reminder text ships inside the proxy binary (include_str!), so hosts see the new wording only after their launchers update.</text>
</svg>
