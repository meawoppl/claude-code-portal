<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect width="2000" height="1200" fill="#16161e"/>
  <defs>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/></marker>
  </defs>
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1866 - remove dead clippy ratchets in frontend</text>
  <text x="55" y="100" font-size="34" fill="#e6e9f5">Two modules carried unwrap/expect suppressions with no unwraps to suppress;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">deleting the 6 dead lines lets the deny-by-default ratchet cover them.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666"/>
  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <g>
    <rect x="80" y="255" width="840" height="175" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="108" y="302" font-size="26" fill="#7aa2f7">links.rs + agents_panel.rs: dead headers</text>
    <text x="108" y="345" font-size="23" fill="#a9b1d6">each opens with a TODO(#1165) ratchet comment</text>
    <text x="108" y="388" font-size="21" fill="#565f89">#![allow(clippy::unwrap_used, clippy::expect_used)]</text>
  </g>
  <line x1="500" y1="430" x2="500" y2="510" stroke="#f7768e" stroke-width="2" marker-end="url(#red-arrow)"/>
  <g>
    <rect x="80" y="520" width="840" height="260" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="108" y="567" font-size="26" fill="#c0caf5">Nothing there left to suppress</text>
    <text x="108" y="612" font-size="23" fill="#a9b1d6">links.rs: zero unwrap()/expect() calls</text>
    <text x="108" y="655" font-size="23" fill="#a9b1d6">(only unwrap_or, which the lint ignores)</text>
    <text x="108" y="698" font-size="23" fill="#a9b1d6">agents_panel.rs: zero unwrap()/expect() calls</text>
    <text x="108" y="741" font-size="23" fill="#f7768e">the TODO describes work already done</text>
  </g>
  <g>
    <rect x="80" y="855" width="840" height="155" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="108" y="902" font-size="26" fill="#c0caf5">6 lines doing the job of 0</text>
    <text x="108" y="946" font-size="23" fill="#f7768e">stale comments claim debt that is paid off</text>
  </g>

  <g>
    <rect x="1065" y="255" width="860" height="175" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1093" y="302" font-size="26" fill="#7aa2f7">headers start at the real content</text>
    <text x="1093" y="345" font-size="23" fill="#a9b1d6">use yew::prelude::*; / //! Agents triage matrix ...</text>
    <text x="1093" y="388" font-size="21" fill="#565f89">no suppression, no stale TODO</text>
  </g>
  <line x1="1495" y1="430" x2="1495" y2="510" stroke="#9ece6a" stroke-width="2" marker-end="url(#green-arrow)"/>
  <g>
    <rect x="1065" y="520" width="860" height="260" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1093" y="567" font-size="26" fill="#9ece6a">The workspace deny now applies</text>
    <text x="1093" y="612" font-size="23" fill="#a9b1d6">a future unwrap()/expect() fails clippy here</text>
    <text x="1093" y="655" font-size="23" fill="#a9b1d6">exactly the ratchet #1165 item 8 wants</text>
    <text x="1093" y="698" font-size="23" fill="#9ece6a">zero functional change: comments only</text>
    <text x="1093" y="741" font-size="23" fill="#565f89">no behavior, API, or render delta</text>
  </g>
  <g>
    <rect x="1065" y="855" width="860" height="155" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1093" y="902" font-size="26" fill="#c0caf5">Same build, smaller surface</text>
    <text x="1093" y="946" font-size="23" fill="#9ece6a">clippy clean; 682 frontend tests pass</text>
  </g>
  <text x="55" y="1172" font-size="22" fill="#565f89">Scope: two comment-only deletions in frontend - no logic, wire, or render change.</text>
</svg>
