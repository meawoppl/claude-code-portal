<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1791 · Remove unwrap ratchet from four frontend files</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Render paths panicked on unwrap(): a split char boundary or empty list killed the view;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now checked gets and exhaustive matches, so bad input ends the scan — not the session.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <g>
    <rect x="80" y="250" width="860" height="132" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="292" font-size="26" fill="#7aa2f7">text[i..].chars().next().unwrap() ×3</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">index runs first: a split-mid-char boundary panics</text>
    <text x="104" y="364" font-size="22" fill="#565f89">math.rs — fence, inline-code, and main loops</text>
  </g>
  <g>
    <rect x="80" y="402" width="860" height="132" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="444" font-size="26" fill="#7aa2f7">items.split_last().unwrap()</text>
    <text x="104" y="482" font-size="23" fill="#a9b1d6">join_english: an empty slice panics the describe path</text>
    <text x="104" y="516" font-size="22" fill="#565f89">cron_describe.rs — reached from describe()</text>
  </g>
  <g>
    <rect x="80" y="554" width="860" height="132" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="596" font-size="26" fill="#7aa2f7">dead #![allow(clippy::unwrap_used)] ×2</text>
    <text x="104" y="634" font-size="23" fill="#a9b1d6">links.rs, agents_panel.rs — no violation underneath</text>
    <text x="104" y="668" font-size="22" fill="#565f89">a live ratchet hides real future violations</text>
  </g>
  <line x1="510" y1="686" x2="510" y2="940" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">panic in a render path kills the WASM view</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">one bad input ends the whole session UI</text>
  </g>

  <g>
    <rect x="1065" y="250" width="860" height="132" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="292" font-size="26" fill="#9ece6a">text.get(i..).and_then(chars) + break</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">boundary check first; None ends the scan safely</text>
    <text x="1089" y="364" font-size="22" fill="#565f89">identical bytes on all valid UTF-8 input</text>
  </g>
  <g>
    <rect x="1065" y="402" width="860" height="132" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="444" font-size="26" fill="#9ece6a">match split_last — None → empty string</text>
    <text x="1089" y="482" font-size="23" fill="#a9b1d6">unreachable arm (len ≥ 3) keeps the fn total</text>
    <text x="1089" y="516" font-size="22" fill="#565f89">describe() never panics on list shape</text>
  </g>
  <g>
    <rect x="1065" y="554" width="860" height="132" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="596" font-size="26" fill="#9ece6a">allows deleted — deny-by-default holds</text>
    <text x="1089" y="634" font-size="23" fill="#a9b1d6">clippy.toml exempts tests; production must be clean</text>
    <text x="1089" y="668" font-size="22" fill="#565f89">future unwraps fail the build loudly</text>
  </g>
  <line x1="1495" y1="686" x2="1495" y2="940" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">same rendering, no panic path</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">677 frontend tests pass; clippy clean</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Covers 4 of the 16 #1165 ratchet files; the remaining twelve ride in follow-up PRs.</text>
</svg>
